name: Build & Publish NuGet

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    
    env:
      BUILD_CONFIG: 'Release'
      PROJ_DIR: ${{github.workspace}}/LeoAnalyzers
      NUGET_DIR: ${{github.workspace}}/nupkgs

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Create Package Directory
        run: mkdir nupkgs
      - name: Build
        run: dotnet build -c ${{env.BUILD_CONFIG}}
        working-directory: ${{env.PROJ_DIR}}
      - name: Pack
        run: dotnet pack -c ${{env.BUILD_CONFIG}} --output ${{env.NUGET_DIR}}
        working-directory: ${{env.PROJ_DIR}}
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: markushaslinger
      - name: Publish
        working-directory: ${{env.NUGET_DIR}}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet Packages
          path: ${{env.NUGET_DIR}}/*.nupkg
          retention-days: 1
