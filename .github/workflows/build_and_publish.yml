name: Build & Publish NuGet

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      id-token: write

    env:
      BUILD_CONFIG: 'Release'
      NUGET_DIR: ${{github.workspace}}/nupkgs

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 11.0: build and the union tests (they use the SDK's compiler); 9.0: runtime of LeoAnalyzers.Tests
          dotnet-version: |
            9.0.x
            11.0.x
      - name: Create Package Directory
        run: mkdir nupkgs
      # The analyzers are used in every project, so nothing is published unless all tests pass.
      - name: Test analyzers
        run: dotnet test LeoAnalyzers.Tests -c ${{env.BUILD_CONFIG}}
      - name: Test analyzers against the SDK compiler (unions)
        run: dotnet test LeoAnalyzers.Compiler.Tests -c ${{env.BUILD_CONFIG}}
      - name: Test code fixes
        run: dotnet test LeoAnalyzers.CodeFixes.Tests -c ${{env.BUILD_CONFIG}}
      - name: Build
        run: dotnet build LeoAnalyzers.Package -c ${{env.BUILD_CONFIG}}
      - name: Pack
        run: dotnet pack LeoAnalyzers.Package -c ${{env.BUILD_CONFIG}} --no-build --output ${{env.NUGET_DIR}}
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: markushaslinger
      - name: Publish
        working-directory: ${{env.NUGET_DIR}}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet Packages
          path: ${{env.NUGET_DIR}}/*.nupkg
          retention-days: 1
